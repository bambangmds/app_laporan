    <script>
      // Intercept and handle Vite HMR WebSocket connections to prevent console errors in proxy environment
      (function() {
        const OriginalWebSocket = window.WebSocket;
        if (OriginalWebSocket) {
          const PatchedWebSocket = function(url, protocols) {
            if (typeof url === 'string' && (
              url.includes('ais-dev-') || 
              url.includes('localhost') || 
              url.includes('127.0.0.1') || 
              url.includes('/vite-hmr') || 
              url.includes('hmr') ||
              url.includes('ws://') ||
              url.includes('wss://')
            )) {
              // Create a dummy WebSocket object that does nothing and never throws connection refused errors
              const dummySocket = {
                url: url,
                readyState: 0, // CONNECTING
                bufferedAmount: 0,
                extensions: '',
                protocol: protocols || '',
                binaryType: 'blob',
                close: function() { this.readyState = 3; },
                send: function() {},
                addEventListener: function(event, callback) {
                  if (event === 'error') {
                    // Swallow error events
                  }
                },
                removeEventListener: function() {},
                onopen: null,
                onerror: null,
                onclose: null,
                onmessage: null
              };
              // Wait a bit and transition state or trigger close
              setTimeout(function() {
                dummySocket.readyState = 3; // CLOSED
                if (typeof dummySocket.onclose === 'function') {
                  dummySocket.onclose({ code: 1000, reason: "HMR disabled safely", wasClean: true });
                }
              }, 100);
              return dummySocket;
            }
            return new OriginalWebSocket(url, protocols);
          };
          PatchedWebSocket.prototype = OriginalWebSocket.prototype;
          window.WebSocket = PatchedWebSocket;
        }
      })();
    </script>
